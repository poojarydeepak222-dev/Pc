name: Deploy PC website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf extracted site
          mkdir -p extracted site
          unzip -q PC-Free-main.zip -d extracted

          INDEX_DIR="$(dirname "$(find extracted -type f -name index.html | head -n 1)")"

          if [ -z "$INDEX_DIR" ] || [ "$INDEX_DIR" = "." ]; then
            echo "index.html was not found in PC-Free-main.zip"
            exit 1
          fi

          echo "Publishing from: $INDEX_DIR"
          cp -a "$INDEX_DIR"/. site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
